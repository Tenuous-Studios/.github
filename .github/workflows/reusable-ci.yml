name: Reusable Organization CI

on:
  workflow_call:
    inputs:
      language:
        description: 'Target language (e.g., gdscript, javascript, python, etc.)'
        required: true
        type: string
      run-docs:
        default: false
        type: boolean

jobs:
  check-language:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.check.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        shell: bash
        run: |
          LANG="${{ inputs.language }}"
          
          # 1. Handle Godot specifically
          if [ "$LANG" == "gdscript" ]; then
            if find . -maxdepth 5 -type f -name "*.gd" | grep . > /dev/null; then
              echo "mode=gdscript" >> $GITHUB_OUTPUT
              exit 0
            else
              echo "::error::No .gd files found for language: gdscript"
              exit 1
            fi
          fi

          # 2. Handle CodeQL languages
          declare -A ext_map=( ["javascript"]="js|ts|jsx|tsx" ["python"]="py" ["go"]="go" ["java"]="java" ["csharp"]="cs" ["cpp"]="cpp|c|hpp|h" ["ruby"]="rb" )
          EXT=${ext_map[$LANG]}

          if [ -n "$EXT" ]; then
            if find . -maxdepth 5 -type f | grep -E "\.($EXT)$" > /dev/null; then
              echo "mode=codeql" >> $GITHUB_OUTPUT
            else
              echo "::error::No files found for CodeQL language: $LANG"
              exit 1
            fi
          else
            echo "::error::Language '$LANG' is not supported by this workflow (expected gdscript or CodeQL languages)."
            exit 1
          fi

  godot-checks:
    needs: check-language
    if: needs.check-language.outputs.mode == 'gdscript'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install GDScript Toolkit
        uses: Scony/godot-gdscript-toolkit@master

      - name: Run Quality Checks
        shell: bash
        run: |
          # 1. Run Linting (Redirecting stderr to stdout with 2>&1)
          set +e
          LINT_OUTPUT=$(gdlint . 2>&1)
          LINT_EXIT_CODE=$?
          
          # 2. Run Formatting Check (Redirecting stderr to stdout with 2>&1)
          FORMAT_OUTPUT=$(gdformat --check . 2>&1)
          FORMAT_EXIT_CODE=$?
          set -e

          # 3. Process Linting Results
          if [ $LINT_EXIT_CODE -ne 0 ]; then
            echo "::error::GDScript linting issues detected."
            echo "### ⚠️ GDScript Linting Violations" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            echo "$LINT_OUTPUT" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          # 4. Process Formatting Results
          if [ $FORMAT_EXIT_CODE -ne 0 ]; then
            echo "::error::GDScript formatting issues detected."
            echo "### ❌ GDScript Formatting Error" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            echo "$FORMAT_OUTPUT" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          # 5. Final Failure & Instructions
          if [ $LINT_EXIT_CODE -ne 0 ] || [ $FORMAT_EXIT_CODE -ne 0 ]; then
            echo "---" >> $GITHUB_STEP_SUMMARY
            echo "#### 🛠️ How to Fix" >> $GITHUB_STEP_SUMMARY
            echo "Run: \`pip install gdtoolkit && gdformat . && gdlint .\`" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  analyze:
    name: Security Scan (CodeQL)
    needs: check-language
    if: needs.check-language.outputs.mode == 'codeql'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ inputs.language }}
      - uses: github/codeql-action/analyze@v4

  deploy-docs:
    name: Build & Deploy Docs
    needs: [godot-checks, analyze]
    # Runs if docs are requested AND the active test job passed (or was correctly skipped)
    if: |
      always() && inputs.run-docs && 
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.godot-checks.result == 'success' || needs.analyze.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p ./public
          echo "Documentation built on $(date)" > ./public/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - uses: actions/deploy-pages@v4
