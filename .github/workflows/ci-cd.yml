name: CI Quality & Docs

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  # 1. Quality & Security Scan
  analyze:
    name: Security Scan (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: 'javascript' # Change to your primary language (e.g., python, go, etc.)

      - name: Perform Analysis
        uses: github/codeql-action/analyze@v3

  # 2. Automated Documentation (Runs only on merge to main)
  deploy-docs:
    name: Build & Deploy Docs
    needs: analyze
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docs
        run: |
          echo "Building documentation..."
          # Insert your doc generator command here (e.g., 'npm run docs' or 'mkdocs build')
          mkdir -p ./public
          cp README.md ./public/index.md 

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
