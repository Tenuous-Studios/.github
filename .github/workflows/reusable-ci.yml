# FILE: Tenuous-Studios/.github/.github/workflows/reusable-ci.yml
name: Reusable Organization CI

on:
  workflow_call:
    inputs:
      language:
        description: 'Target language (e.g., gdscript, javascript, python, go, java, csharp, ruby, cpp)'
        required: true
        type: string
      run-docs:
        description: 'Whether to build and deploy docs'
        default: false
        type: boolean

jobs:
  godot-checks:
    if: inputs.language == 'gdscript'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GDScript Toolkit
        uses: Scony/godot-gdscript-toolkit@master
      - name: Lint and Format
        run: |
          gdformat --check .
          gdlint .

  check-language:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        shell: bash
        run: |
          LANG="${{ inputs.language }}"
          # Map CodeQL languages to common file extensions
          declare -A ext_map=( ["javascript"]="js|ts|jsx|tsx" ["python"]="py" ["go"]="go" ["java"]="java" ["csharp"]="cs" ["cpp"]="cpp|c|hpp|h" ["ruby"]="rb" )
          EXT=${ext_map[$LANG]}
          
          if [ -z "$EXT" ]; then
            echo "Unknown language mapping for $LANG. Defaulting to 'true' to attempt scan."
            echo "exists=true" >> $GITHUB_OUTPUT
          elif find . -maxdepth 5 -type f | grep -E "\.($EXT)$" > /dev/null; then
            echo "Found $LANG files. Proceeding with scan."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "No $LANG files found. Skipping scan."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
          
  analyze:
    name: Security Scan (CodeQL)
    needs: check-language
    if: needs.check-language.outputs.exists == 'true' # Skip if no code found
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ inputs.language }}

      - name: Perform Analysis
        uses: github/codeql-action/analyze@v4

  deploy-docs:
    name: Build & Deploy Docs
    if: inputs.run-docs && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docs
        run: |
          mkdir -p ./public
          # Customize this: e.g., cp README.md ./public/index.md
          echo "Documentation built on $(date)" > ./public/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
