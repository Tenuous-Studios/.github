# FILE: Tenuous-Studios/.github/.github/workflows/reusable-ci.yml
name: Reusable Organization CI

on:
  workflow_call:
    inputs:
      language:
        description: 'Language for CodeQL (e.g., javascript, python)'
        default: 'javascript'
        required: false
        type: string
      run-docs:
        description: 'Whether to build and deploy docs'
        default: false
        required: false
        type: boolean

jobs:
  analyze:
    name: Security Scan (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ inputs.language }}

      - name: Perform Analysis
        uses: github/codeql-action/analyze@v4

  deploy-docs:
    name: Build & Deploy Docs
    needs: analyze
    if: inputs.run-docs && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docs
        run: |
          mkdir -p ./public
          # Customize this: e.g., cp README.md ./public/index.md
          echo "Documentation built on $(date)" > ./public/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
